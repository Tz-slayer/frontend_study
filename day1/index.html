<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>day1</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="is-preload">
    <div class="main">
      <div class="header"></div>
      <div class="content">
        <div class="frame frame4"></div>
        <div class="frame frame1">
          <img src="day1.jpg" alt="" />
        </div>

        <div class="frame frame2">
          <img src="day1.jpg" alt="" />
        </div>

        <div class="frame frame3">
          <img src="day1.jpg" alt="" />
        </div>

        <div class="line-container">
          <div class="dot"></div>
          <div class="line line-top"></div>
          <span>雷<br />电</span>
          <div class="line line-bottom"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div class="decorate">
        <div class="corner corner-top-right">
          <div class="decor-line decor-h decor-h1"></div>
          <div class="decor-line decor-h decor-h2"></div>
          <div class="decor-line decor-v decor-v1"></div>
          <div class="decor-line decor-v decor-v2"></div>
        </div>
        <div class="corner corner-bottom-left">
          <div class="decor-line decor-h decor-h1"></div>
          <div class="decor-line decor-h decor-h2"></div>
          <div class="decor-line decor-v decor-v1"></div>
          <div class="decor-line decor-v decor-v2"></div>
        </div>
      </div>

      <img class="crown" src="./crown_cutout.png" alt="" />

      <div class="footer"></div>
    </div>

    <script>
      // 用统一时间轴驱动各阶段入场，允许阶段之间有重叠而不是硬性串行。
      const timeline = [
        { name: "stage-bg", at: 0 },
        { name: "stage-frame", at: 650 },
        { name: "stage-decor", at: 1100 },
        { name: "stage-crown", at: 1700 },
        // 人物内容不跟切片框一起出现，而是等皇冠落位后再被释放出来。
        { name: "stage-portrait", at: 2050 },
        { name: "stage-name", at: 2550 },
        { name: "stage-idle", at: 3050 }
      ];

      window.addEventListener("load", () => {
        requestAnimationFrame(() => {
          timeline.forEach(({ name, at }) => {
            window.setTimeout(() => {
              document.body.classList.add(name);
            }, at);
          });
        });
      });
    </script>
  </body>
</html>
